version: '3.9'

services:
  backend:
    build: ./backend
    container_name: adaptive_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    networks:
      - neuralearn_net

  ml_service:
    build: ./ml_service
    container_name: adaptive_ml_service
    ports:
      - "8001:8001"
    volumes:
      - ./ml_service:/ml_service
    networks:
      - neuralearn_net

  frontend:
    build: ./frontend
    container_name: adaptive_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
    networks:
      - neuralearn_net
    depends_on:
      - backend
      - ml_service

networks:
  neuralearn_net:
    driver: bridge
