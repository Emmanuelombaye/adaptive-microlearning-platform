# nginx/default.conf - reverse proxy for NeuraLearn
server {
    listen 80;
    server_name _; # replace with your domain in production

    # Redirect http to https (handled later if certs present)
    location / {
        return 301 https://System.Management.Automation.Internal.Host.InternalHost;
    }
}

# HTTPS server block (certs expected at /etc/letsencrypt/live/<domain>)
server {
    listen 443 ssl http2;
    server_name _; # replace with your domain

    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
    }

    # ML service proxy
    location /ml/ {
        proxy_pass http://ml_service:8001/;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
    }

    # Frontend (SPA)
    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
        try_files  / /index.html;
    }
}
