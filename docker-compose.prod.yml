version: '3.8'

services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: neuralearn_frontend
    networks:
      - neuralearn_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: neuralearn_backend
    env_file: .env
    environment:
      - DATABASE_URL=
      - JWT_SECRET=
    networks:
      - neuralearn_net
    depends_on:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile.prod
    container_name: neuralearn_ml
    env_file: .env
    networks:
      - neuralearn_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  db:
    image: mysql:8.0
    container_name: neuralearn_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_DATABASE: 
      MYSQL_USER: 
      MYSQL_PASSWORD: 
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - neuralearn_net

  nginx:
    image: nginx:stable-alpine
    container_name: neuralearn_nginx
    depends_on:
      - frontend
      - backend
      - ml_service
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
      - certs-data:/var/lib/letsencrypt
      - ./nginx/logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - neuralearn_net
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: neuralearn_certbot
    volumes:
      - certs:/etc/letsencrypt
      - certs-data:/var/lib/letsencrypt
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    entrypoint: ""
    networks:
      - neuralearn_net

volumes:
  db_data:
  certs:
  certs-data:

networks:
  neuralearn_net:
    driver: bridge
